name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-release:
    name: Build and create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.8.2"

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Verify release tag
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.semVer }}
          TAG_NAME: ${{ github.ref_name }}
        run: test "$TAG_NAME" = "v$RELEASE_VERSION"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Stamp package version
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: uv version "$RELEASE_VERSION"

      - name: Test and build distributions
        run: |
          uv sync --locked --extra test
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: "dist/*"

      - name: Upload distributions
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            ## Installation

            Download the attached wheel or install it directly:

            ```bash
            python -m pip install "https://github.com/DownAtTheBottomOfTheMoleHole/ollama-tokeniser/releases/download/${{ github.ref_name }}/ollama_tokeniser-${{ steps.gitversion.outputs.semVer }}-py3-none-any.whl"
            ```

            The initial dependency and tokenizer downloads require internet access. Token counting,
            prompt fitting, proxying, and Ollama inference then run locally without GitHub or Copilot
            model-request tokens.

            ## Release artefacts

            This release contains a Python wheel and source distribution with GitHub build-provenance
            attestations. Verify a downloaded artefact with:

            ```bash
            gh attestation verify <artefact> --repo DownAtTheBottomOfTheMoleHole/ollama-tokeniser
            ```

            ## Changes
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG_NAME" dist/*
          --title "$TAG_NAME"
          --generate-notes
          --notes "$RELEASE_NOTES"
          --verify-tag
          --fail-on-no-commits

  publish-pypi:
    name: Publish to PyPI with Trusted Publishing
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ollama-tokeniser/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
