[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ollama-tokeniser"
version = "0.1.0"
description = "Token-aware prompt truncation for Ollama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Carl Dawson" }]
keywords = ["ollama", "tokenizer", "tokeniser", "vscode", "copilot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "jinja2>=3.1,<4",
  "ollama>=0.4,<1",
  "transformers>=4.45,<6",
]

[project.urls]
Documentation = "https://github.com/DownAtTheBottomOfTheMoleHole/ollama-tokeniser#readme"
Issues = "https://github.com/DownAtTheBottomOfTheMoleHole/ollama-tokeniser/issues"
Repository = "https://github.com/DownAtTheBottomOfTheMoleHole/ollama-tokeniser"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "ruff>=0.14,<1",
]

[project.scripts]
ollama-tokeniser = "ollama_tokeniser.cli:main"
ollama-tokeniser-proxy = "ollama_tokeniser.proxy:main"
ollama-tokeniser-cache = "ollama_tokeniser.proxy:cache_main"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_tokeniser"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/GitVersion.yml",
  "/tokenizers.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
