workflow: GitHubFlow/v1
tag-prefix: '[vV]'
semantic-version-format: Strict
commit-message-incrementing: Enabled
major-version-bump-message: '^(feat|fix|perf|refactor)(\([^)]+\))?!:|^BREAKING CHANGE:'
minor-version-bump-message: '^feat(\([^)]+\))?:'
patch-version-bump-message: '^(fix|perf|refactor)(\([^)]+\))?:'
no-bump-message: '^(build|chore|ci|docs|style|test)(\([^)]+\))?:'
